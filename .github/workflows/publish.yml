name: Publish

# Publish to npm on a version tag (e.g. `v0.3.0`) via npm trusted publishing
# (OIDC): the package trusts playbox-org/playable-kit + publish.yml on npmjs.com,
# so no NPM_TOKEN. Needs npm >= 11.5.1 / Node >= 22.14, hence Node 24.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # prepublishOnly builds dist; scoped package needs --access public.
      - run: npm publish --provenance --access public
